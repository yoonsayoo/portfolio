<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoon Sa-yoo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, sans-serif;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100vh;
      padding: 20px;
      background: #ffffff;
      overflow-y: auto;
    }

    .logo {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #555555;
      font-size: 14px;
    }

    .menu-title {
      color: #111111;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .menu-sub {
      padding-left: 10px;
    }

    .content {
      margin-left: 240px;
      padding: 40px 24px;
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      border: 2px solid red;
    }

    @media (max-width: 900px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .content {
        margin-left: 0;
        padding: 20px 18px 18px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">Yoon Sa-yoo</div>

    <div class="menu">
      <div class="menu-title">Works</div>
      <div class="menu-sub">Human</div>
      <button class="menu-sub" id="peopleBtn">People</button>
      <div class="menu-sub">Self-Portraits</div>
      <div class="menu-sub">Narrative</div>
      <div class="menu-sub">Roots</div>
      <div class="menu-sub">Black Room</div>
      <div class="menu-sub">Still Life</div>
      <div class="menu-sub">House</div>
      <div class="menu-sub">Objects</div>
      <div class="menu-sub">Nature</div>
      <div class="menu-sub">Projects</div>
      <div class="menu-sub">Laos National Institute of Fine Arts</div>
      <div class="menu-sub">Room 202</div>
      <div class="menu-sub">Under the Letter</div>
      <div class="menu-title" style="margin-top:20px;">Exhibitions</div>
      <div class="menu-title">Texts</div>
      <div class="menu-title">CV</div>
      <div class="menu-title">Contact</div>
    </div>
  </aside>

  <main class="content">

    <!-- HOME -->
    <div id="homeView">
      <p>HOME</p>
      <img
        src="https://yoonsayoo.com/images/the-one-in-white.jpg"
        class="hero-image"
      />
    </div>

    <!-- WORKS -->
    <div id="worksView" style="display:none;">
      <p>WORKS</p>
      <div id="worksGrid" class="works-grid"></div>
    </div>

  </main>
  <script>
    const homeView = document.getElementById("homeView");
    const worksView = document.getElementById("worksView");
    const peopleBtn = document.getElementById("peopleBtn");

    peopleBtn.addEventListener("click", () => {
      homeView.style.display = "none";
      worksView.style.display = "block";
    });
  </script>
</body>
</html>
