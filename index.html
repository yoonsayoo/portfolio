<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoon Sa-yoo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar">
    <button id="homeButton" class="logo-button" type="button">
      Yoon Sa-yoo
    </button>

    <div id="sidebarNav" class="menu"></div>

    <div class="sidebar-footer">
      © 2026 Yoon Sa-yoo
    </div>
  </aside>

  <main class="content">

    <!-- HOME -->
    <div id="homeView" class="view is-active">
      <img
        src="/images/on-the-way-home.jpg"
        alt="Main artwork"
        class="hero-image"
      />
    </div>

    <!-- WORKS -->
    <div id="worksView" class="view">
      <h2 id="worksCurrent" class="works-title"></h2>
      <div id="worksGrid" class="works-grid"></div>
    </div>

    <!-- PAGES -->
    <div id="exhibitionsView" class="view text-view">
      <h2 class="page-heading">Exhibitions</h2>
      <div id="exhibitionsGrid" class="exhibitions-grid"></div>
    </div>

    <div id="exhibitionDetailView" class="view text-view">
      <button id="exhibitionBackButton" class="back-button" type="button">Back</button>

      <div class="exhibition-detail-head">
        <h2 id="exhibitionDetailTitle" class="page-heading"></h2>
        <p id="exhibitionDetailMeta" class="exhibition-meta"></p>
      </div>

      <img id="exhibitionDetailCover" class="exhibition-detail-cover" alt="" />

      <p id="exhibitionDetailText" class="exhibition-detail-text"></p>

      <div id="exhibitionDetailImages" class="exhibition-detail-images"></div>
    </div>
    <div id="textsView" class="view">Texts</div>
    <div id="cvView" class="view">CV</div>
    <div id="contactView" class="view text-view">
      <button class="email-copy" data-email="yoonsayoo@naver.com">
        yoonsayoo@naver.com
      </button>
      <span class="copy-feedback" id="copyFeedback"></span>
    </div>

  </main>

  <!-- VIEWER -->
  <div id="viewer" class="viewer" aria-hidden="true">
    <button id="viewerClose" class="viewer-close">&times;</button>
    <button id="viewerPrev" class="viewer-nav viewer-prev">&#8249;</button>
    <button id="viewerNext" class="viewer-nav viewer-next">&#8250;</button>

    <div class="viewer-stage">
      <div class="viewer-row">
        <img id="viewerImage" />

        <div class="viewer-meta">
          <div id="viewerTitle" class="viewer-title"></div>
          <div id="viewerYear" class="viewer-line"></div>
          <div id="viewerMaterial" class="viewer-line"></div>
          <div id="viewerSize" class="viewer-line"></div>
        </div>
      </div>
    </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
