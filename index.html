<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoon Sa-yoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <aside class="sidebar">
      <button id="homeButton" class="logo-button" type="button">Yoon Sa-yoo</button>

      <div class="menu-block">
        <div class="menu-title">Works</div>
        <div class="menu-group">
          <div class="menu-subtitle">Human</div>
          <button class="series-button" data-series="people" type="button">People</button>
          <button class="series-button" data-series="self-portraits" type="button">Self-Portraits</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <section id="homeView" class="view">
        <div class="hero-image-wrap">
          <img src="images/the-one-in-white.jpg" alt="Main artwork" class="hero-image" />
        </div>
      </section>

      <section id="worksView" class="view is-hidden">
        <h2 id="worksCurrent" class="works-title">People</h2>
        <div id="worksGrid" class="works-grid"></div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
