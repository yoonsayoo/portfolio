<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoon Sa-yoo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <aside class="sidebar">
      <button id="homeButton" class="logo-button" type="button">Yoon Sa-yoo</button>

      <nav class="sidebar-nav">
        <div class="nav-block">
          <div class="page-title">Works</div>

          <div class="nav-section">
            <div class="nav-section-title">인간</div>
            <button class="series-button" type="button" data-series="people">사람들</button>
            <button class="series-button" type="button" data-series="self-portraits">자화상</button>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">이야기</div>
            <button class="series-button" type="button" data-series="roots">뿌리</button>
            <button class="series-button" type="button" data-series="black-room">검은방</button>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">정물</div>
            <button class="series-button" type="button" data-series="house">집</button>
            <button class="series-button" type="button" data-series="objects">사물</button>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">자연</div>
            <button class="series-button" type="button" data-series="nature">자연</button>
          </div>

          <div class="nav-section">
            <div class="nav-section-title">프로젝트</div>
            <button class="series-button" type="button" data-series="laos-national-institute-of-fine-arts">라오스 국립미술원</button>
            <button class="series-button" type="button" data-series="room-202">202호</button>
            <button class="series-button" type="button" data-series="under-the-letter">Under the letter</button>
          </div>
        </div>

        <div class="nav-block">
          <button class="page-button page-title" type="button" data-page="exhibitions">Exhibitions</button>
        </div>

        <div class="nav-block">
          <button class="page-button page-title" type="button" data-page="texts">Texts</button>
        </div>

        <div class="nav-block">
          <button class="page-button page-title" type="button" data-page="cv">CV</button>
        </div>

        <div class="nav-block">
          <button class="page-button page-title" type="button" data-page="contact">Contact</button>
        </div>
      </nav>
    </aside>

    <main class="content">
      <section id="homeView" class="view is-active">
        <div class="hero-image-wrap">
          <img
            src="/images/the-one-in-white.jpg"
            alt="The One in White"
            class="hero-image"
          />
        </div>
      </section>

      <section id="worksView" class="view">
        <div class="view-head">
          <h2 id="worksCurrent"></h2>
        </div>
        <div id="worksGrid" class="works-grid"></div>
      </section>

      <section id="exhibitionsView" class="view text-view">
        <h2 class="page-heading">Exhibitions</h2>
        <ul id="exhibitionsList" class="simple-list"></ul>
      </section>

      <section id="textsView" class="view text-view">
        <h2 class="page-heading">Texts</h2>
      </section>

      <section id="cvView" class="view text-view">
        <h2 class="page-heading">CV</h2>
      </section>

      <section id="contactView" class="view text-view">
        <h2 class="page-heading">Contact</h2>
      </section>
    </main>
  </div>

  <div id="viewer" class="viewer" aria-hidden="true">
    <button id="viewerClose" class="viewer-close" type="button" aria-label="Close viewer">&times;</button>
    <button id="viewerPrev" class="viewer-nav viewer-prev" type="button" aria-label="Previous image">&#8249;</button>
    <button id="viewerNext" class="viewer-nav viewer-next" type="button" aria-label="Next image">&#8250;</button>

    <div class="viewer-stage">
      <img id="viewerImage" src="" alt="" />
      <div class="viewer-meta">
        <div id="viewerTitle" class="viewer-title"></div>
        <div id="viewerYear" class="viewer-line"></div>
        <div id="viewerMaterial" class="viewer-line"></div>
        <div id="viewerSize" class="viewer-line"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
