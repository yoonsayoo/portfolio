<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoon Sa-yoo</title>
  <meta name="description" content="Yoon Sa-yoo portfolio website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <a href="#home">Yoon Sa-yoo</a>
    </div>
  </header>

  <main>
    <section id="home" class="section home-section">
      <div class="home-images">
        <figure class="home-image">
          <img src="images/main-1.jpg" alt="Main artwork 1" />
        </figure>
        <figure class="home-image">
          <img src="images/main-2.jpg" alt="Main artwork 2" />
        </figure>
      </div>
    </section>

    <section id="works" class="section">
      <div class="section-head">
        <h2>Works</h2>
      </div>

      <div class="works-layout">
        <aside class="works-sidebar">
          <details open>
            <summary>Human</summary>
            <ul>
              <li><button class="series-button is-active" data-series="people">People</button></li>
              <li><button class="series-button" data-series="self-portraits">Self-Portraits</button></li>
            </ul>
          </details>

          <details>
            <summary>Narrative</summary>
            <ul>
              <li><button class="series-button" data-series="roots">Roots</button></li>
              <li><button class="series-button" data-series="black-room">Black Room</button></li>
            </ul>
          </details>

          <details>
            <summary>Still Life</summary>
            <ul>
              <li><button class="series-button" data-series="house">House</button></li>
              <li><button class="series-button" data-series="objects">Objects</button></li>
            </ul>
          </details>

          <details>
            <summary>Nature</summary>
            <ul>
              <li><button class="series-button" data-series="nature">Nature</button></li>
            </ul>
          </details>

          <details>
            <summary>Projects</summary>
            <ul>
              <li><button class="series-button" data-series="laos-national-institute-of-fine-arts">Laos National Institute of Fine Arts</button></li>
              <li><button class="series-button" data-series="room-202">Room 202</button></li>
              <li><button class="series-button" data-series="under-the-letter">Under the Letter</button></li>
            </ul>
          </details>
        </aside>

        <div class="works-main">
          <div class="works-current" id="worksCurrent">People</div>

          <div class="works-grid" id="worksGrid">
            <button
              class="thumb"
              type="button"
              data-series="people"
              data-title="Long Marsh"
              data-year="2024"
              data-material="Oil on canvas"
              data-size="130 × 97 cm"
              data-image="images/work-01.jpg"
            >
              <img src="images/work-01.jpg" alt="Long Marsh" />
            </button>

            <button
              class="thumb"
              type="button"
              data-series="people"
              data-title="Stone Figure"
              data-year="2024"
              data-material="Oil on canvas"
              data-size="145 × 112 cm"
              data-image="images/work-02.jpg"
            >
              <img src="images/work-02.jpg" alt="Stone Figure" />
            </button>

            <button
              class="thumb"
              type="button"
              data-series="people"
              data-title="Matchstick Tree"
              data-year="2023"
              data-material="Oil on canvas"
              data-size="91 × 73 cm"
              data-image="images/work-03.jpg"
            >
              <img src="images/work-03.jpg" alt="Matchstick Tree" />
            </button>

            <button
              class="thumb"
              type="button"
              data-series="self-portraits"
              data-title="An Old Dandelion"
              data-year="2022"
              data-material="Oil on canvas"
              data-size="116 × 91 cm"
              data-image="images/work-04.jpg"
            >
              <img src="images/work-04.jpg" alt="An Old Dandelion" />
            </button>

            <button
              class="thumb"
              type="button"
              data-series="self-portraits"
              data-title="Your Cold Heart"
              data-year="2022"
              data-material="Oil on canvas"
              data-size="100 × 80 cm"
              data-image="images/work-05.jpg"
            >
              <img src="images/work-05.jpg" alt="Your Cold Heart" />
            </button>

            <button
              class="thumb"
              type="button"
              data-series="roots"
              data-title="Fish Stairs"
              data-year="2021"
              data-material="Oil on canvas"
              data-size="162 × 130 cm"
              data-image="images/work-06.jpg"
            >
              <img src="images/work-06.jpg" alt="Fish Stairs" />
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="exhibitions" class="section text-section">
      <div class="section-head">
        <h2>Exhibitions</h2>
      </div>
      <ul class="simple-list">
        <li>혼자 가는 먼 집</li>
        <li>화분과 뿌리</li>
        <li>지워지지 않는 연필 자국</li>
      </ul>
    </section>

    <section id="texts" class="section text-section">
      <div class="section-head">
        <h2>Texts</h2>
      </div>
      <p class="muted">Texts coming soon.</p>
    </section>

    <section id="cv" class="section text-section">
      <div class="section-head">
        <h2>CV</h2>
      </div>
      <p class="muted">CV coming soon.</p>
    </section>

    <section id="contact" class="section text-section">
      <div class="section-head">
        <h2>Contact</h2>
      </div>
      <p>Email: <a href="mailto:your@email.com">your@email.com</a></p>
    </section>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close" id="viewerClose" aria-label="Close">×</button>
    <button class="viewer-nav viewer-prev" id="viewerPrev" aria-label="Previous image">‹</button>

    <div class="viewer-stage">
      <img id="viewerImage" src="" alt="" />
      <div class="viewer-meta">
        <div class="viewer-title" id="viewerTitle"></div>
        <div class="viewer-line" id="viewerYear"></div>
        <div class="viewer-line" id="viewerMaterial"></div>
        <div class="viewer-line" id="viewerSize"></div>
      </div>
    </div>

    <button class="viewer-nav viewer-next" id="viewerNext" aria-label="Next image">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
