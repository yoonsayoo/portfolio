<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoon Sa-yoo</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar">
    <button id="homeButton" class="logo-button">Yoon Sa-yoo</button>

    <div class="menu">
      <div class="menu-title">Works</div>

      <div class="menu-subtitle">Human</div>
      <button class="series-button" data-series="people">People</button>
      <button class="series-button" data-series="self-portraits">Self-Portraits</button>

      <div class="menu-title" style="margin-top:20px;">Exhibitions</div>
      <button class="page-button" data-page="exhibitions">Exhibitions</button>

      <div class="menu-title">Texts</div>
      <button class="page-button" data-page="texts">Texts</button>

      <div class="menu-title">CV</div>
      <button class="page-button" data-page="cv">CV</button>

      <div class="menu-title">Contact</div>
      <button class="page-button" data-page="contact">Contact</button>
    </div>
  </aside>

  <main class="content">

    <!-- HOME -->
    <div id="homeView" class="view is-active">
      <div class="hero-image-wrap">
        <img src="/images/nowhere-to-go.jpg" class="hero-image" />
      </div>
    </div>

    <!-- WORKS -->
    <div id="worksView" class="view">
      <div class="view-head">
        <h2 id="worksCurrent"></h2>
      </div>
      <div id="worksGrid" class="works-grid"></div>
    </div>

    <!-- OTHER PAGES -->
    <div id="exhibitionsView" class="view">Exhibitions</div>
    <div id="textsView" class="view">Texts</div>
    <div id="cvView" class="view">CV</div>
    <div id="contactView" class="view">Contact</div>

  </main>

  <!-- VIEWER -->
  <div id="viewer" class="viewer" aria-hidden="true">
    <button id="viewerClose" class="viewer-close">&times;</button>
    <button id="viewerPrev" class="viewer-nav viewer-prev">&#8249;</button>
    <button id="viewerNext" class="viewer-nav viewer-next">&#8250;</button>

    <div class="viewer-stage">
      <img id="viewerImage" />
      <div class="viewer-meta">
        <div id="viewerTitle" class="viewer-title"></div>
        <div id="viewerYear" class="viewer-line"></div>
        <div id="viewerMaterial" class="viewer-line"></div>
        <div id="viewerSize" class="viewer-line"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
